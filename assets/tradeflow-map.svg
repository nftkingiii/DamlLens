<svg width="960" height="640" viewBox="0 0 960 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Canton TradeFlow workflow map</title>
  <desc id="desc">Supplier, buyer, financier, and auditor connected through a tokenized receivable workflow.</desc>
  <rect width="960" height="640" rx="32" fill="#151514"/>
  <rect x="46" y="46" width="868" height="548" rx="28" fill="#20201D" stroke="#34342F"/>
  <path d="M151 319C205 204 333 146 474 164C615 182 742 252 805 357" stroke="#C9F24D" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 16"/>
  <path d="M153 322C242 432 378 492 517 471C656 450 753 375 804 356" stroke="#66E2D5" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 16"/>
  <circle cx="161" cy="321" r="74" fill="#F8F6EC"/>
  <circle cx="800" cy="355" r="74" fill="#F8F6EC"/>
  <circle cx="481" cy="162" r="74" fill="#F8F6EC"/>
  <circle cx="514" cy="473" r="74" fill="#F8F6EC"/>
  <rect x="311" y="263" width="338" height="118" rx="24" fill="#C9F24D"/>
  <text x="480" y="308" text-anchor="middle" fill="#151514" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Tokenized Receivable</text>
  <text x="480" y="340" text-anchor="middle" fill="#2B2B25" font-family="Inter, Arial, sans-serif" font-size="15">state, permissions, evidence, settlement</text>
  <text x="161" y="309" text-anchor="middle" fill="#151514" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Supplier</text>
  <text x="161" y="336" text-anchor="middle" fill="#55554C" font-family="Inter, Arial, sans-serif" font-size="13">creates invoice</text>
  <text x="800" y="343" text-anchor="middle" fill="#151514" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Buyer</text>
  <text x="800" y="370" text-anchor="middle" fill="#55554C" font-family="Inter, Arial, sans-serif" font-size="13">approves debt</text>
  <text x="481" y="150" text-anchor="middle" fill="#151514" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Financier</text>
  <text x="481" y="177" text-anchor="middle" fill="#55554C" font-family="Inter, Arial, sans-serif" font-size="13">funds receivable</text>
  <text x="514" y="461" text-anchor="middle" fill="#151514" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Auditor</text>
  <text x="514" y="488" text-anchor="middle" fill="#55554C" font-family="Inter, Arial, sans-serif" font-size="13">reads trail</text>
  <rect x="92" y="504" width="776" height="46" rx="23" fill="#2B2B27"/>
  <text x="480" y="532" text-anchor="middle" fill="#F8F6EC" font-family="Inter, Arial, sans-serif" font-size="14">Create -> Verify -> Finance -> Settle -> Audit</text>
</svg>
